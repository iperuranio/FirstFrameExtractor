name: Build standalone executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Niente artifact di Actions: su un tag v* ogni build carica il suo pacchetto su una release in bozza,
# che Nexus non considera, e l'ultimo job la pubblica quando ha tutti gli allegati. Così la release
# nasce intera (contratto delle release di Nexus, sezione 3) e lo spazio degli artifact, comune a
# tutti i repo dell'account, non ferma mai un rilascio.
permissions:
  contents: read

jobs:
  draft:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  build:
    name: Build (${{ matrix.os }})
    needs: draft
    # Also on a push to main, where there is no draft: the build is checked, nothing is published.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: FirstFrameExtractor-macos
          - os: windows-latest
            artifact: FirstFrameExtractor-windows

    steps:
      # The token that writes releases stays out of .git/config: what pip installs cannot read it.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # La versione sta in FirstFrameExtractor.spec (CFBundleShortVersionString): l'app Mac la dichiara
      # nell'Info.plist, lo zip Windows in version.txt, ed è lì che la legge l'app Nexus.
      # Un tag con un'altra versione fa fallire la build: una release non contraddice mai la sua app.
      - name: Version
        shell: bash
        run: |
          version=$(sed -n 's/.*"CFBundleShortVersionString": *"\([^"]*\)".*/\1/p' FirstFrameExtractor.spec | head -1)
          [ -n "$version" ] || { echo "ERRORE: CFBundleShortVersionString non trovato in FirstFrameExtractor.spec"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "ERRORE: il tag $GITHUB_REF_NAME non corrisponde alla versione $version di FirstFrameExtractor.spec"; exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      # Su Windows prova anche il collegamento vero nel menu Start (COM): scritto, riletto, lasciato com'è.
      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm FirstFrameExtractor.spec

      # --- Package output --------------------------------------------------
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/build-dmg.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Content -Path "dist/version.txt" -Value $env:APP_VERSION -Encoding utf8NoBOM
          Compress-Archive -Path "dist/FirstFrameExtractor.exe", "dist/version.txt" -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: Upload to the draft (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/FirstFrameExtractor-macos.dmg --repo "$GITHUB_REPOSITORY"

      - name: Upload to the draft (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/${{ matrix.artifact }}.zip" --repo "$GITHUB_REPOSITORY"

  # --- Release on tag push, in one go -----------------------------------
  # Da bozza a pubblicata in un passo, solo quando ha il dmg e lo zip (contratto delle release di
  # Nexus, sezione 3): chi controlla mentre la build gira non la vede mai a metà.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          names=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[] | select(.state == "uploaded") | .name' | sort | tr '\n' ' ')
          expected="FirstFrameExtractor-macos.dmg FirstFrameExtractor-windows.zip "
          [ "$names" = "$expected" ] || { echo "the draft holds «$names», it needs «$expected»"; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"

  # A build that failed or was cancelled leaves no draft behind; the tag stays, for a new run.
  drop-draft:
    name: Drop the draft
    needs: [draft, build, release]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (failure() || cancelled()) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Drop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "true" ]; then gh release delete "$GITHUB_REF_NAME" --yes --repo "$GITHUB_REPOSITORY"; else echo "no draft to drop ($draft)"; fi
