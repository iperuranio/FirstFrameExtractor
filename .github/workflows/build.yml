name: Build standalone executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Necessario per creare/allegare gli asset alla Release sui tag v*.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: FirstFrameExtractor-macos
          - os: windows-latest
            artifact: FirstFrameExtractor-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # La versione sta in FirstFrameExtractor.spec (CFBundleShortVersionString): l'app Mac la dichiara
      # nell'Info.plist, lo zip Windows in version.txt, ed è lì che la legge l'app Nexus.
      # Un tag con un'altra versione fa fallire la build: una release non contraddice mai la sua app.
      - name: Version
        shell: bash
        run: |
          version=$(sed -n 's/.*"CFBundleShortVersionString": *"\([^"]*\)".*/\1/p' FirstFrameExtractor.spec | head -1)
          [ -n "$version" ] || { echo "ERRORE: CFBundleShortVersionString non trovato in FirstFrameExtractor.spec"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "ERRORE: il tag $GITHUB_REF_NAME non corrisponde alla versione $version di FirstFrameExtractor.spec"; exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm FirstFrameExtractor.spec

      # --- Package output --------------------------------------------------
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/build-dmg.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Content -Path "dist/version.txt" -Value $env:APP_VERSION -Encoding utf8NoBOM
          Compress-Archive -Path "dist/FirstFrameExtractor.exe", "dist/version.txt" -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/FirstFrameExtractor-macos.dmg

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip

      # --- Attach to a Release on tag push ---------------------------------
      - name: Attach to Release (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FirstFrameExtractor-macos.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach to Release (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
