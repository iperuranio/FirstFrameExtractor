name: Build standalone executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Necessario per creare/allegare gli asset alla Release sui tag v*.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: FirstFrameExtractor-macos
          - os: windows-latest
            artifact: FirstFrameExtractor-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # La versione sta in FirstFrameExtractor.spec (CFBundleShortVersionString): l'app Mac la dichiara
      # nell'Info.plist, lo zip Windows in version.txt, ed è lì che la legge l'app Nexus.
      # Un tag con un'altra versione fa fallire la build: una release non contraddice mai la sua app.
      - name: Version
        shell: bash
        run: |
          version=$(sed -n 's/.*"CFBundleShortVersionString": *"\([^"]*\)".*/\1/p' FirstFrameExtractor.spec | head -1)
          [ -n "$version" ] || { echo "ERRORE: CFBundleShortVersionString non trovato in FirstFrameExtractor.spec"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "ERRORE: il tag $GITHUB_REF_NAME non corrisponde alla versione $version di FirstFrameExtractor.spec"; exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      # Su Windows prova anche il collegamento vero nel menu Start (COM): scritto, riletto, lasciato com'è.
      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm FirstFrameExtractor.spec

      # --- Package output --------------------------------------------------
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/build-dmg.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Content -Path "dist/version.txt" -Value $env:APP_VERSION -Encoding utf8NoBOM
          Compress-Archive -Path "dist/FirstFrameExtractor.exe", "dist/version.txt" -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/FirstFrameExtractor-macos.dmg
          # solo per passarlo al job della release, che lo copia lì: un giorno basta
          retention-days: 1

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          # solo per passarlo al job della release, che lo copia lì: un giorno basta
          retention-days: 1

  # --- Release on tag push, in one go -----------------------------------
  # La release nasce già con il dmg e lo zip (contratto delle release di Nexus, sezione 3):
  # chi controlla mentre la build gira non la vede mai a metà.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/FirstFrameExtractor-macos.dmg dist/FirstFrameExtractor-windows.zip
